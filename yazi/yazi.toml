[opener]
document = [ ]
text = [
  { run = '"$EDITOR" "$@"', block = true, orphan = false, for = 'unix' }
]

[open]
rules = [
  # { name = '*.pdf', use = 'document' },
  # { name = '*.epub', use = 'document' },
  { url = '*.csv', use = 'text'},
  { url = '*.txt', use = 'text'}
]

[mgr]
linemode = "size"
show_symlink = true
