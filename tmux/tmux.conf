set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ',xterm-256color:Tc'
set -ga terminal-overrides ',xterm-kitty:RGB'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Window
set -g mouse on

## Window global/default configuration
set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_status 'yes'
set -g @catppuccin_window_text ' #W '
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text ' #W '
set -g @catppuccin_window_current_text_color '#{E:@thm_surface_2}'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# set left and right status bar
set -g window-status-separator ''
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_session}#{E:@catppuccin_status_application}'
set -g pane-border-lines heavy
# set -g window-status-format ' #I#{?#{!=:#{window_name},Window},: #W,} '

set -g popup-border-lines 'heavy'
set -g menu-border-lines 'heavy'

# Popups (scripts in ./scripts). popup.sh dims the window behind the popup as
# a backdrop; it must run via run-shell, which also expands the formats here.
# @popup_backdrop_alpha: how much to darken the window behind, in percent.
set -g @popup_backdrop_alpha 20

# Obsidian daily notes: prefix + N opens a which-key style menu, then
# d (today), y (yesterday) or t (tomorrow) opens that note in a popup.
bind-key N display-menu -x C -y C -T '#[align=centre] Daily Notes ' \
  'Today'     d "run-shell \"~/.config/tmux/scripts/daily-note.sh popup '#{window_id}' '#{client_name}' '#{client_theme}' today\"" \
  'Yesterday' y "run-shell \"~/.config/tmux/scripts/daily-note.sh popup '#{window_id}' '#{client_name}' '#{client_theme}' yesterday\"" \
  'Tomorrow'  t "run-shell \"~/.config/tmux/scripts/daily-note.sh popup '#{window_id}' '#{client_name}' '#{client_theme}' tomorrow\""

# Menu colours: catppuccin only styles the selected menu item, so match the
# rest to its popup style. set -F bakes in the current palette, so this is
# re-applied after each theme switch (hooks below) and at startup (after the
# catppuccin run at the bottom).
%hidden MENU_STYLE='set -gF menu-style "bg=default,fg=#{@thm_fg}" ; set -gF menu-border-style "fg=#{@thm_surface_2}"'

set-hook -g client-dark-theme "source ~/.config/tmux/dark-theme.tmux.conf; $MENU_STYLE"
set-hook -g client-light-theme "source ~/.config/tmux/light-theme.tmux.conf; $MENU_STYLE"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Run plugins
run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux
if -F 1 "$MENU_STYLE"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run ~/.config/tmux/plugins/tpm/tpm
